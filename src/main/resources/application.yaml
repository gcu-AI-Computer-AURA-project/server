spring:
  application:
    name: AURA_Service
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/aura-schema.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs

aura:
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 1209600
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    api-timeout-seconds: ${AURA_GOOGLE_API_TIMEOUT_SECONDS:60}
  scan:
    gmail-max-messages: ${AURA_SCAN_GMAIL_MAX_MESSAGES:0}
    drive-max-files: ${AURA_SCAN_DRIVE_MAX_FILES:0}
  fcm:
    credential-path: ${FCM_CREDENTIAL_PATH:}
  ai:
    provider: ${AURA_AI_PROVIDER:GEMINI_API}
    analysis-enabled: ${AURA_AI_ANALYSIS_ENABLED:true}
    batch-size: ${AURA_AI_BATCH_SIZE:20}
    request-timeout-seconds: ${AURA_AI_REQUEST_TIMEOUT_SECONDS:30}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1/interactions}
      model: ${GEMINI_MODEL:gemini-3.1-flash-lite}

