name: Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: aura-prod-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/gcu-ai-computer-aura-project/aura-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build boot jar
        run: ./gradlew clean bootJar -x test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.EC2_DEPLOY_PATH }}

            cat > .env << 'EOF'
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            JWT_SECRET=${{ secrets.JWT_SECRET }}
            TOKEN_ENCRYPTION_KEY=${{ secrets.TOKEN_ENCRYPTION_KEY }}

            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}

            FCM_CREDENTIAL_PATH=${{ secrets.FCM_CREDENTIAL_PATH }}

            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GEMINI_API_URL=${{ secrets.GEMINI_API_URL }}
            GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}

            AURA_AI_PROVIDER=${{ secrets.AURA_AI_PROVIDER }}
            AURA_AI_ANALYSIS_ENABLED=${{ secrets.AURA_AI_ANALYSIS_ENABLED }}
            AURA_AI_BATCH_SIZE=${{ secrets.AURA_AI_BATCH_SIZE }}
            AURA_AI_REQUEST_TIMEOUT_SECONDS=${{ secrets.AURA_AI_REQUEST_TIMEOUT_SECONDS }}
            EOF

            chmod 600 .env

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            INFRA_SOURCE_DIR="${INFRA_SOURCE_DIR:-/home/ec2-user/source/AURA_infra}"

            if [ ! -d "$INFRA_SOURCE_DIR/.git" ]; then
              mkdir -p "$(dirname "$INFRA_SOURCE_DIR")"
              git clone https://github.com/gcu-AI-Computer-AURA-project/AURA_infra.git "$INFRA_SOURCE_DIR"
            else
              git -C "$INFRA_SOURCE_DIR" pull --ff-only
            fi

            mkdir -p scripts
            cp "$INFRA_SOURCE_DIR/scripts/deploy.sh" scripts/deploy.sh
            chmod +x scripts/deploy.sh

            bash scripts/deploy.sh
